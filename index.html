<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="A three.js simulation of the planet system revolving around a monolith, catered to my personal aesthetics.">
  <title>Monolitharium</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10, 0, 20, 0.75);
      border: 1px solid rgba(136, 0, 255, 0.35);
      border-radius: 40px;
      padding: 10px 22px;
      backdrop-filter: blur(8px);
      user-select: none;
      z-index: 10;
    }
    #controls label {
      color: rgba(180, 130, 255, 0.9);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #speedSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 3px;
      background: linear-gradient(to right, #8800ff, #00ffcc);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #speedSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px #8800ff;
      cursor: pointer;
    }
    #speedVal {
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      min-width: 28px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label>Orbit Speed</label>
    <input type="range" id="speedSlider" min="0" max="5" step="0.05" value="1">
    <span id="speedVal">1.0x</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
